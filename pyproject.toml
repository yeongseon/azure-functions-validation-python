[project]
name = "azure-functions-validation"
description = "Validation and serialization layer for Azure Functions Python v2 programming model"
keywords = ["azure-functions", "azure", "python", "v2", "validation", "pydantic", "serialization", "serverless"]
authors = [{ name = "Yeongseon Choe", email = "yeongseon.choe@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.15"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    # Cap below 2.0.0: azure-functions v2 may change worker function-indexing
    # behavior this package relies on. See knowledge#46 / dx#8.
    "azure-functions>=1.17,<2.0.0",
    "pydantic>=2.0,<3.0",
]

[project.urls]
Homepage = "https://yeongseon.dev/azure-functions-python/validation/"
Documentation = "https://yeongseon.dev/azure-functions-python/validation/"
Repository = "https://github.com/yeongseon/azure-functions-validation-python"
Issues = "https://github.com/yeongseon/azure-functions-validation-python/issues"

[project.optional-dependencies]
dev = [
    "bandit==1.9.4",
    "build",
    "coverage",
    "git-cliff",
    "hatch",
    "mypy==2.3.1",
    "pre-commit",
    "pytest",
    "pytest-anyio",
    "pytest-cov",
    "ruff==0.16.2",
    "jsonschema",
    "requests",
    "types-requests",
]
docs = [
    "mkdocs<2.0",
    "mkdocs-material<10.0",
    "mkdocstrings[python]<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

# Schema data files under src/azure_functions_validation/schemas/ are included
# automatically via sources=["src"]. Do NOT use force-include with a src/-prefixed
# path: it breaks build-via-sdist (the sdist strips the src/ prefix), which is how
# the PyPI publish workflow builds the wheel.

[tool.hatch.version]
path = "src/azure_functions_validation/__init__.py"

[tool.hatch.publish.index]
default = "pypi"

[tool.hatch.publish.index.repos.pypi]
url = "https://upload.pypi.org/legacy/"

[tool.hatch.publish.index.repos.test]
url = "https://test.pypi.org/legacy/"

[tool.hatch.envs.default]
python = "3.10"
features = ["dev", "docs"]

[tool.hatch.envs.default.scripts]
format = "ruff format src tests"
style = "ruff check src tests"
typecheck = "mypy src tests"
lint = "hatch run style && hatch run typecheck"
test = "pytest -v tests"
cov = "pytest --cov-report=term-missing --cov-report=html --cov-report=xml tests/"
e2e-azure = "pytest -v -m e2e tests/e2e/"
docs = "mkdocs serve"
precommit = "pre-commit run --all-files"
precommit-install = "pre-commit install"
security = "python -m bandit -r src"

[tool.ruff]
line-length = 100
target-version = "py310"
# Honor `exclude` lists even when ruff is invoked with explicit file paths
# (e.g. the pre-commit ruff-format hook, which passes staged filenames). This
# keeps _metadata_helpers.py's format-exclude effective in every invocation.
# Linting is unaffected: `[tool.ruff.lint]` has no exclude, so the file is
# still linted; only formatting is skipped for it (see #273).
force-exclude = true

[tool.ruff.format]
# _metadata_helpers.py is byte-identical across sibling packages (see #273).
# Exclude it from formatting so `ruff format` can never silently break the
# byte-identity invariant guarded by tests/test_metadata_helpers_drift.py.
exclude = ["src/azure_functions_validation/_metadata_helpers.py"]



[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["azure_functions_validation"]
force-sort-within-sections = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "examples.*"
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "--cov=src/azure_functions_validation --cov-report=xml --cov-report=term-missing -ra -q -m 'not e2e and not compat2x'"
testpaths = ["tests"]
pythonpath = ["src", ".", "examples", "tests/_test_app"]
markers = [
    "e2e: real Azure end-to-end tests (require E2E_BASE_URL)",
    "compat2x: opt-in azure-functions 2.x compatibility spike (require AZFUNC_2X_SPIKE=1)",
]

[tool.coverage.run]
branch = true
source = ["src/azure_functions_validation"]

[tool.coverage.report]
show_missing = true
fail_under = 95
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]
