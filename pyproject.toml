[project]
name = "azure-functions-validation"
description = "Validation and serialization layer for Azure Functions Python v2 programming model"
keywords = ["azure-functions", "azure", "python", "v2", "validation", "pydantic", "serialization", "serverless"]
authors = [{ name = "Yeongseon Choe", email = "yeongseon.choe@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.15"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    # azure-functions 2.x drops Python < 3.13, so the constraint is split by
    # interpreter (following sibling azure-functions-openapi #529 /
    # azure-functions-langgraph #457): Python < 3.13 stays capped at <2.0.0
    # (2.x is uninstallable there — the current Linux Consumption default
    # target, still on the certified 1.x line), while Python >= 3.13 is allowed
    # onto the 2.x line but capped below <3.0.0 so an uncertified
    # azure-functions 3.x is never pulled in silently. The 2.x path is proven by
    # the wheel-based "azure-functions 2.x compat" matrix in ci-test.yml (real
    # Python 3.13/3.14 interpreters); real-Azure certification via e2e-azure.yml
    # remains a separate follow-up. See knowledge#46 / dx#8 / #348.
    "azure-functions>=1.21.0,<2.0.0; python_version < '3.13'",
    "azure-functions>=1.21.0,<3.0.0; python_version >= '3.13'",
    "pydantic>=2.0,<3.0",
]

[project.urls]
Homepage = "https://yeongseon.dev/azure-functions-python/validation/"
Documentation = "https://yeongseon.dev/azure-functions-python/validation/"
Repository = "https://github.com/yeongseon/azure-functions-validation-python"
Issues = "https://github.com/yeongseon/azure-functions-validation-python/issues"

[project.optional-dependencies]
dev = [
    "bandit==1.9.4",
    "build",
    "coverage",
    "hatch",
    "mypy==2.4.0",
    "pre-commit",
    "pytest",
    "pytest-anyio",
    "pytest-cov",
    "ruff==0.16.10",
    "jsonschema",
    "requests",
    "types-requests",
]
docs = [
    "mkdocs<2.0",
    "mkdocs-material<10.0",
    "mkdocstrings[python]<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

# Schema data files under src/azure_functions_validation/schemas/ are included
# automatically via sources=["src"]. Do NOT use force-include with a src/-prefixed
# path: it breaks build-via-sdist (the sdist strips the src/ prefix), which is how
# the PyPI publish workflow builds the wheel.

[tool.hatch.build.targets.sdist]
# Documentation images and CI config are needed by neither a build nor a test
# run, and dominated the published sdist.
exclude = [
  "**/*.png",
  "**/*.gif",
  "**/*.jpg",
  ".github",
]

[tool.hatch.version]
path = "src/azure_functions_validation/__init__.py"

[tool.hatch.publish.index]
default = "pypi"

[tool.hatch.publish.index.repos.pypi]
url = "https://upload.pypi.org/legacy/"

[tool.hatch.publish.index.repos.test]
url = "https://test.pypi.org/legacy/"

[tool.hatch.envs.default]
python = "3.11"
features = ["dev", "docs"]

[tool.hatch.envs.default.scripts]
format = "ruff format src tests"
format-check = "ruff format --check src tests"
style = "ruff check src tests && ruff format --check src tests"
typecheck = "mypy src tests"
lint = "hatch run style && hatch run typecheck"
test = "pytest -v tests"
cov = "pytest --cov-report=term-missing --cov-report=html --cov-report=xml tests/"
e2e-azure = "pytest -v -m e2e tests/e2e/"
docs = "mkdocs serve"
precommit = "pre-commit run --all-files"
precommit-install = "pre-commit install"
security = "python -m bandit -r src"

[tool.ruff]
line-length = 100
target-version = "py311"
# Honor `exclude` lists even when ruff is invoked with explicit file paths
# (e.g. the pre-commit ruff-format hook, which passes staged filenames). This
# keeps _metadata_helpers.py's format-exclude effective in every invocation.
# Linting is unaffected: `[tool.ruff.lint]` has no exclude, so the file is
# still linted; only formatting is skipped for it (see #273).
force-exclude = true

[tool.ruff.format]
# _metadata_helpers.py is byte-identical across sibling packages (see #273).
# Exclude it from formatting so `ruff format` can never silently break the
# byte-identity invariant guarded by tests/test_metadata_helpers_drift.py.
exclude = ["src/azure_functions_validation/_metadata_helpers.py"]



[tool.ruff.lint]
# C4 + UP keep the codebase on modern syntax (PEP 585/604 generics and
# unions, comprehension forms) instead of the legacy `typing.List` /
# `Optional[...]` spellings. target-version = "py311" bounds every fix to
# syntax the declared floor supports.
select = ["C4", "E", "F", "I", "UP"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# _metadata_helpers.py is hand-synced byte-identically across sibling packages
# and pinned by sha256 in tests/test_metadata_helpers_drift.py (see #273/#270).
# UP fixes would rewrite its imports and flip that hash, so the file stays on
# its frozen spelling. Changing it requires the documented lockstep procedure,
# not an autofix.
"src/azure_functions_validation/_metadata_helpers.py" = ["UP"]

[tool.ruff.lint.isort]
known-first-party = ["azure_functions_validation"]
force-sort-within-sections = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
exclude = ["tests/host_smoke"]

[[tool.mypy.overrides]]
module = "examples.*"
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "--cov=src/azure_functions_validation --cov-report=xml --cov-report=term-missing -ra -q -m 'not e2e and not compat2x'"
testpaths = ["tests"]
pythonpath = ["src", ".", "examples", "tests/_test_app"]
markers = [
    "e2e: real Azure end-to-end tests (require E2E_BASE_URL)",
    "compat2x: opt-in azure-functions 2.x compatibility spike (require AZFUNC_2X_SPIKE=1)",
]

[tool.coverage.run]
branch = true
source = ["src/azure_functions_validation"]

[tool.coverage.report]
show_missing = true
fail_under = 95
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]
