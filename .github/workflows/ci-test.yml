name: Test and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Classify the PR diff as docs-only or not. This gates the (expensive) test
  # matrix for pull requests while the release gate (publish-pypi.yml) and the
  # security workflows (codeql.yml / security.yml) are NEVER selectively skipped.
  #
  # docs_only is only ever computed for pull_request events; push events to
  # protected branches always run the full matrix (docs_only stays 'false').
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Full CI on anything that is not a pull request (push to main/develop).
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "Not a pull_request event (${EVENT_NAME}); running full CI."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          echo "Changed files:"
          echo "${files}"

          if [ -z "${files}" ]; then
            # No files detected -> be conservative and run full CI.
            echo "No changed files detected; running full CI."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          IFS=$'\n'
          for f in ${files}; do
            case "${f}" in
              # NEVER docs-only: any change here must run the full matrix.
              # In bash 'case', '*' matches '/', so 'src/*' covers nested paths.
              src/* | tests/* | examples/* | cookbook/* | \
              pyproject.toml | hatch.toml | Makefile | \
              requirements*.txt | *.lock | \
              .github/workflows/* | .github/actions/* | \
              Dockerfile | docker-compose*.yml | docker-compose*.yaml)
                echo "Non-docs path forces full CI: ${f}"
                docs_only=false
                break
                ;;
              # Docs allowlist.
              *.md | docs/* | .omc/*)
                ;;
              # Anything unrecognised is treated as non-docs (fail safe).
              *)
                echo "Unrecognised path forces full CI: ${f}"
                docs_only=false
                break
                ;;
            esac
          done
          unset IFS

          echo "docs_only=${docs_only}"
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  # Lint, type-check and security run once on a single pinned interpreter
  # (Python 3.10, matching the ruff/mypy target-version in pyproject). These
  # checks are interpreter-agnostic, so fanning them across the matrix would
  # only duplicate work. Installed with a plain `pip install -e '.[dev]'` so the
  # checks run on the interpreter this job provisions (NOT through the
  # Python-3.10-pinned hatch env, which is what silently forced the whole test
  # matrix onto 3.10 before this fix).
  quality:
    name: Lint, type-check & security (Py 3.10)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check endpoint schema hash pin
        run: |
          python -c "import hashlib, pathlib, sys; d = pathlib.Path('src/azure_functions_validation/schemas'); expected = (d / 'endpoint.schema.sha256').read_text().split()[0]; actual = hashlib.sha256((d / 'endpoint.schema.json').read_bytes()).hexdigest(); print('endpoint.schema.json digest matches pin.') if expected == actual else sys.exit('endpoint.schema.json digest drift:\n  pinned:  ' + expected + '\n  actual:  ' + actual + '\nUpdate endpoint.schema.sha256 if this change is intentional.')"

      - name: Lint workflows (pin hygiene + release-gate canonical SHAs)
        run: |
          python tools/lint_release_workflows.py
          python tools/lint_workflow_pins.py

      - name: Ruff style check
        run: ruff check src tests

      - name: Type check (mypy, strict)
        run: mypy src tests

      - name: Security scan (bandit)
        run: python -m bandit -r src

  test:
    name: Test (Py ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full test suite runs against the declared dependency contract
        # (azure-functions>=1.17,<2.0.0). That 1.x line is only installable on
        # Python 3.10-3.12 (recent 1.x releases pin requires-python <3.13), so
        # the matrix stops at 3.12. Python 3.13/3.14 carry a separate,
        # non-blocking `azure-functions-2x` compatibility lane below - running
        # the full suite there would require the (uncertified) 2.x worker path.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Assert the runtime interpreter matches the matrix cell
        # Tests must run on the interpreter this cell claims to exercise. Before
        # this fix the whole matrix ran through the Python-3.10-pinned hatch env,
        # so 3.11/3.12 were never actually tested. This guard fails loudly if the
        # running interpreter ever drifts from matrix.python-version again.
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os, sys
          expected = tuple(int(p) for p in os.environ["EXPECTED"].split("."))
          actual = sys.version_info[: len(expected)]
          assert actual == expected, f"interpreter {actual} != matrix {expected}"
          print(f"interpreter OK: {sys.version.split()[0]}")
          PY

      - name: Install package with dev extras (on the matrix interpreter)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests on the matrix interpreter
        # Raw pytest on the interpreter provisioned above (NOT through the
        # Python-3.10-pinned hatch env). The repo pytest config enables --cov
        # with fail_under=95; enforce that gate on the canonical 3.10 cell and
        # run the other cells with --no-cov so a version-variant cell cannot
        # fail the build on a spurious coverage dip.
        env:
          IS_COVERAGE_CELL: ${{ matrix.python-version == '3.10' }}
        run: |
          if [ "$IS_COVERAGE_CELL" = "true" ]; then
            pytest tests/
          else
            pytest tests/ --no-cov
          fi

      - name: Verify coverage output
        if: matrix.python-version == '3.10'
        run: ls -lh coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: false
        env:
          CODECOV_RETRIES: 3

  # Single required status check for branch protection. It always runs so the
  # required check is never left permanently pending. It passes when the diff is
  # docs-only (test matrix intentionally skipped) or when the quality job and
  # the test matrix both succeeded, and fails otherwise.
  ci-required:
    needs: [changes, quality, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          set -euo pipefail
          echo "changes result: ${CHANGES_RESULT}"
          echo "quality result: ${QUALITY_RESULT}"
          echo "test result:    ${TEST_RESULT}"
          echo "docs_only:      ${DOCS_ONLY}"

          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "Classification job did not succeed; failing required check."
            exit 1
          fi

          if [ "${DOCS_ONLY}" = "true" ]; then
            echo "Docs-only change: quality + test intentionally skipped. Passing."
            exit 0
          fi

          if [ "${QUALITY_RESULT}" = "success" ] && [ "${TEST_RESULT}" = "success" ]; then
            echo "Quality and test matrix succeeded. Passing."
            exit 0
          fi

          echo "quality='${QUALITY_RESULT}' test='${TEST_RESULT}'. Failing required check."
          exit 1

  # azure-functions 2.x compatibility proof lane (issue #351), modeled on
  # langgraph d433b63. This is a SINGLE representative 2.x lane, not a matrix:
  # it builds the wheel, installs it, overrides the pyproject `<2.0.0` cap to
  # pull `azure-functions>=2,<3`, and runs the opt-in WorkerCompat spike against
  # the wheel-installed package.
  #
  # Gating decision (see docs/azure-functions-2.0-readiness.md): this lane runs
  # on every non-docs PR as a VISIBLE compatibility signal, but it is
  # intentionally NOT wired into the `ci-required` aggregation job, so it does
  # not block merges. Worker/loader compatibility is existential, yet the
  # runtime cap stays `<2.0.0` until 2.x is certified on real Azure via
  # e2e-azure.yml; making this lane blocking before that certification would
  # gate merges on an uncertified runtime. Promote it to a required check via
  # branch protection once the cap is lifted. azure-functions 2.x declares
  # Requires-Python >=3.13, so this lane pins Python 3.13.
  azure-functions-2x:
    name: azure-functions 2.x compat (Py 3.13)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build wheel
        # Prove 2.x against a WHEEL-installed build, not an editable/source tree.
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install wheel with dev extra
        # Use a PEP 508 direct reference (name[extra] @ file://ABS_PATH) so pip
        # resolves the dev extra from the wheel metadata; pip does not parse
        # extras from a bare local wheel path.
        run: |
          wheel="$(ls dist/azure_functions_validation-*.whl)"
          pip install "azure-functions-validation[dev] @ file://$(readlink -f "$wheel")"

      - name: Upgrade azure-functions to the 2.x line
        # pyproject caps azure-functions <2.0.0 until 2.x is certified on real
        # Azure (see docs/azure-functions-2.0-readiness.md). This lane
        # deliberately overrides that cap to PROVE the WorkerCompat surface
        # (signature override, no leaked kwargs, no __wrapped__, unannotated
        # req, non-empty worker indexing) holds under 2.x. pip warns about the
        # intentional override; that is expected.
        run: pip install "azure-functions>=2,<3"

      - name: Show resolved versions
        run: pip show azure-functions pydantic | grep -E '^(Name|Version):'

      - name: Run the WorkerCompat spike against the wheel + azure-functions 2.x
        # The spike is opt-in: it is marked `compat2x` (excluded from the default
        # addopts) and additionally gated on AZFUNC_2X_SPIKE=1. `-o addopts=`
        # clears the default marker-exclusion + coverage flags; `-m compat2x`
        # selects only the spike; `-o pythonpath=` clears the repo's src/tests
        # pythonpath so the installed WHEEL is exercised, not the source tree.
        env:
          AZFUNC_2X_SPIKE: "1"
        run: |
          pytest -m compat2x -o addopts= -o pythonpath= \
            tests/test_worker_compat_2x_spike.py -v
