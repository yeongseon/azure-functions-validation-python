name: Test and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Ruff format check (changed Python files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.8'

      - name: Check changed Python files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_pr_format.py "$PR_BASE_SHA" "$PR_HEAD_SHA"

  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      full_required: ${{ steps.classify.outputs.full_required }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name != 'pull_request' && github.sha || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.event.pull_request.base.sha) }}

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          tools/ci_classify_workflow_changes.sh \
            "${EVENT_NAME}" "${BASE_SHA}" "${HEAD_SHA}" "${HEAD_REPOSITORY}" \
            "${REPOSITORY}" "${PR_NUMBER}" "${BEFORE_SHA}" "${SHA}" \

  # Lint and type-check run once on a single pinned interpreter
  # (Python 3.11, matching the ruff/mypy target-version in pyproject). These
  # checks are interpreter-agnostic, so fanning them across the matrix would
  # only duplicate work. Installed with a plain `pip install -e '.[dev]'` so the
  # checks run on the interpreter this job provisions (NOT through the
  # Python-pinned Hatch env, which previously silently forced the whole test
  # matrix onto its default interpreter).
  quality:
    name: Lint & type-check (Py 3.11)
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check endpoint schema hash pin
        run: pytest --no-cov tests/test_endpoint_schema.py::TestSchemaHashPin

      - name: Lint workflows (pin hygiene + release-gate canonical SHAs)
        run: |
          python tools/lint_release_workflows.py
          python tools/lint_workflow_pins.py

      - name: Hatch/matrix hygiene lint
        run: python tools/lint_hatch_matrix.py

      - name: Ruff style check
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check (mypy, strict)
        run: mypy src tests

  test:
    name: Test (Py ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise the full suite across every interpreter declared in
        # requires-python. The dependency markers install azure-functions 1.x
        # on Python 3.11-3.12 and 2.x on Python 3.13-3.14.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Assert the runtime interpreter matches the matrix cell
        # Tests must run on the interpreter this cell claims to exercise. Before
        # this fix the whole matrix ran through the default pinned Hatch env,
        # so 3.11/3.12 were never actually tested. This guard fails loudly if the
        # running interpreter ever drifts from matrix.python-version again.
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os, sys
          expected = tuple(int(p) for p in os.environ["EXPECTED"].split("."))
          actual = sys.version_info[: len(expected)]
          assert actual == expected, f"interpreter {actual} != matrix {expected}"
          print(f"interpreter OK: {sys.version.split()[0]}")
          PY

      - name: Install package with dev extras (on the matrix interpreter)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests on the matrix interpreter
        # Raw pytest on the interpreter provisioned above (NOT through the
        # default pinned Hatch env). The repo pytest config enables --cov
        # with fail_under=95; enforce that gate on the canonical 3.11 cell and
        # run the other cells with --no-cov so a version-variant cell cannot
        # fail the build on a spurious coverage dip.
        env:
          IS_COVERAGE_CELL: ${{ matrix.python-version == '3.11' }}
        run: |
          if [ "$IS_COVERAGE_CELL" = "true" ]; then
            pytest tests/
          else
            pytest tests/ --no-cov
          fi

      - name: Verify coverage output
        if: matrix.python-version == '3.11'
        run: ls -lh coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: false
        env:
          CODECOV_RETRIES: 3

  docs-check:
    name: Documentation checks
    needs: changes
    if: needs.changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs checks
        run: pip install -e ".[docs]" pytest pytest-cov PyYAML

      - name: Build docs (strict)
        run: mkdocs build --strict

      - name: Check README examples and screenshot manifest
        run: |
          pytest --no-cov tests/test_examples.py::TestReadmeQuickStart \
            tests/test_screenshot_manifest.py

      - name: Check endpoint schema hash pin
        run: |
          python -c "import hashlib, pathlib, sys; d = pathlib.Path('src/azure_functions_validation/schemas'); expected = (d / 'endpoint.schema.sha256').read_text().split()[0]; actual = hashlib.sha256((d / 'endpoint.schema.json').read_bytes()).hexdigest(); print('endpoint.schema.json digest matches pin.') if expected == actual else sys.exit('endpoint.schema.json digest drift:\n  pinned:  ' + expected + '\n  actual:  ' + actual + '\nUpdate endpoint.schema.sha256 if this change is intentional.')"

  # Single required status check for branch protection. It always runs so the
  # required check is never left permanently pending. It passes when the diff is
  # docs-only (test matrix intentionally skipped) or when the quality job and
  # the test matrix both succeeded, and fails otherwise.
  ci-required:
    needs:
      - changes
      - format
      - docs-check
      - quality
      - test
      - minimum-dependencies
      - artifact-build
      - artifact-python310-negative
      - artifact-python311
      - azure-functions-2x
      - host-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name != 'pull_request' && github.sha || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.event.pull_request.base.sha) }}

      - name: Evaluate required checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
          FULL_REQUIRED: ${{ needs.changes.outputs.full_required }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<< "${NEEDS_JSON}" \
            | tools/ci_check_required_results.sh \
                "${EVENT_NAME}" "${DOCS_CHANGED}" "${FULL_REQUIRED}"

  minimum-dependencies:
    name: Minimum dependencies (Py 3.11)
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install minimum runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "azure-functions==1.21.0"
          pip install -e ".[dev]"

      - name: Assert the declared azure-functions floor is resolved
        run: |
          pip show azure-functions azure-functions-validation
          python - <<'PY'
          from importlib.metadata import version

          resolved = version("azure-functions")
          print(f"resolved azure-functions={resolved}")
          assert resolved == "1.21.0"
          PY

      - name: Run full suite against minimum runtime dependencies
        run: pytest tests/ --no-cov

  artifact-build:
    name: Build compatibility artifacts
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload compatibility artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-dist
          path: dist/
          if-no-files-found: error

  artifact-python310-negative:
    name: Wheel install rejection (Py 3.10, negative test)
    needs: [changes, artifact-build]
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.10 for negative install test
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compatibility-dist
          path: compatibility-dist

      - name: Require wheel rejection by Requires-Python
        run: |
          wheel=$(find compatibility-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          if output=$(python -m pip install --no-deps "$wheel" 2>&1); then
            echo "::error ::Python 3.10 unexpectedly installed the candidate wheel"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -F "requires a different Python" <<<"$output"
          grep -F "3.10" <<<"$output"
          grep -F ">=3.11" <<<"$output"

  artifact-python311:
    name: Wheel install and smoke (Py 3.11)
    needs: [changes, artifact-build]
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compatibility-dist
          path: compatibility-dist

      - name: Install wheel with runtime dependencies
        run: |
          wheel=$(find compatibility-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install "$wheel"

      - name: Check installed wheel outside the checkout
        working-directory: /tmp
        env:
          CHECKOUT: ${{ github.workspace }}
        run: |
          python -m pip check
          python - <<'PY'
          import os
          from pathlib import Path

          import azure_functions_validation
          from azure_functions_validation import PydanticAdapter, validate_http

          module_path = Path(azure_functions_validation.__file__).resolve()
          checkout = Path(os.environ["CHECKOUT"]).resolve()
          print(f"imported module: {module_path}")
          assert not module_path.is_relative_to(checkout)
          assert callable(validate_http)
          assert PydanticAdapter.__name__ == "PydanticAdapter"
          PY

  host-smoke:
    name: Real Functions host smoke (Py ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tests/host_smoke/requirements.txt

      - name: Install Functions Core Tools v4 and Azurite
        run: |
          npm install --global azure-functions-core-tools@4 --unsafe-perm true
          npm install --global azurite

      - name: Install smoke app dependencies
        working-directory: tests/host_smoke
        run: pip install -r requirements.txt

      - name: Start Azurite and Functions host
        run: |
          azurite --silent > /tmp/azurite.log 2>&1 &
          cd tests/host_smoke
          func start --python --port 7071 > /tmp/functions-host.log 2>&1 &

      - name: Call validated handler
        run: |
          for attempt in {1..30}; do
            if response="$(curl --fail --silent http://127.0.0.1:7071/api/smoke)"; then
              python -c 'import json, sys; assert json.loads(sys.argv[1]) == {"function_name": "smoke"}' "$response"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/functions-host.log
          exit 1

  # azure-functions 2.x compatibility proof lane (issue #351), modeled on
  # langgraph d433b63. This is a SINGLE representative 2.x lane, not a matrix:
  # it builds the wheel, installs it, overrides the pyproject cap to pull
  # `azure-functions>=2,<3`, and runs the opt-in WorkerCompat spike against
  # the wheel-installed package.
  #
  # Gating: this lane IS wired into `ci-required`. It was originally advisory
  # because the runtime cap stayed `<2.0.0` until 2.x was certified, and gating
  # on an uncertified runtime would have been wrong. That condition no longer
  # holds -- pyproject now ships `azure-functions>=1.17,<3.0.0` for
  # Python >= 3.13, so users can already install 2.x and the lane is the only
  # thing proving it works. azure-functions 2.x declares Requires-Python
  # >=3.13, so this lane pins Python 3.13.
  azure-functions-2x:
    name: azure-functions 2.x compat (Py 3.13)
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        # Prove 2.x against a WHEEL-installed build, not an editable/source tree.
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install wheel with dev extra
        # Use a PEP 508 direct reference (name[extra] @ file://ABS_PATH) so pip
        # resolves the dev extra from the wheel metadata; pip does not parse
        # extras from a bare local wheel path.
        run: |
          wheel="$(ls dist/azure_functions_validation-*.whl)"
          pip install "azure-functions-validation[dev] @ file://$(readlink -f "$wheel")"

      - name: Upgrade azure-functions to the 2.x line
        # pyproject caps azure-functions <2.0.0 until 2.x is certified on real
        # Azure (see docs/azure-functions-2.0-readiness.md). This lane
        # deliberately overrides that cap to PROVE the WorkerCompat surface
        # (signature override, no leaked kwargs, no __wrapped__, unannotated
        # req, non-empty worker indexing) holds under 2.x. pip warns about the
        # intentional override; that is expected.
        run: pip install "azure-functions>=2,<3"

      - name: Show resolved versions
        run: pip show azure-functions pydantic | grep -E '^(Name|Version):'

      - name: Run the WorkerCompat spike against the wheel + azure-functions 2.x
        # The spike is opt-in: it is marked `compat2x` (excluded from the default
        # addopts) and additionally gated on AZFUNC_2X_SPIKE=1. `-o addopts=`
        # clears the default marker-exclusion + coverage flags; `-m compat2x`
        # selects only the spike; `-o pythonpath=` clears the repo's src/tests
        # pythonpath so the installed WHEEL is exercised, not the source tree.
        env:
          AZFUNC_2X_SPIKE: "1"
        run: |
          pytest -m compat2x -o addopts= -o pythonpath= \
            tests/test_worker_compat_2x_spike.py -v
