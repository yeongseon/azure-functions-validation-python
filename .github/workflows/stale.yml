name: "Stale branch and issue management"

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      delete_branches:
        description: "Actually delete stale branches. Leave false for a dry run."
        type: boolean
        default: false
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  # Maintenance jobs are write-capable, so they must never be reachable from a
  # pull_request event — including one opened from a fork.
  stale-issues:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'yeongseon/azure-functions-validation-python'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: "Stale issues and PRs"
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has been marked as stale because it has not had recent activity. It will be closed in 7 days if no further activity occurs. Please reopen if this is still relevant."
          stale-pr-message: "This pull request has been labelled stale because it has not had recent activity. It will not be closed automatically; the label is a prompt for a maintainer to pick it back up. Comment if it is still relevant."
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "needs-triage,pinned,security,enhancement,bug,documentation,chore,good first issue,help wanted"
          exempt-pr-labels: "pinned,security,enhancement,bug,documentation"
          exempt-draft-pr: true
          days-before-stale: 30
          days-before-issue-close: 7
          days-before-pr-close: -1

  stale-branches:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'yeongseon/azure-functions-validation-python'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: "Delete stale branches"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DELETE_BRANCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.delete_branches || 'false' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const dryRun = process.env.DELETE_BRANCHES !== 'true';
            const { owner, repo } = context.repo;
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 90);

            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.default_branch;

            // paginate: a single page silently truncates the keep-list, and a
            // missed open PR means deleting a branch that is still in review.
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const closedPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'closed', per_page: 100,
            });

            const keep = new Set([defaultBranch, 'gh-pages']);
            for (const pr of openPulls) {
              if (pr.head?.ref) keep.add(pr.head.ref);
            }

            // Key on the head SHA the pull request actually merged, not on the
            // branch name. A reused name whose tip has moved on must not be
            // treated as merged.
            const mergedHeadShas = new Map();
            for (const pr of closedPulls) {
              if (!pr.merged_at || !pr.head?.ref) continue;
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) continue;
              const prior = mergedHeadShas.get(pr.head.ref);
              if (!prior || new Date(pr.merged_at) > prior.mergedAt) {
                mergedHeadShas.set(pr.head.ref, {
                  sha: pr.head.sha,
                  mergedAt: new Date(pr.merged_at),
                });
              }
            }

            const isProtected = async (name) => {
              try {
                await github.rest.repos.getBranchProtection({ owner, repo, branch: name });
                return true;
              } catch (error) {
                if (error.status === 404) return false;
                // Anything other than "no protection configured" is unknown
                // state, so treat it as protected and skip.
                console.log(`Cannot read protection for ${name} (${error.status}); skipping.`);
                return true;
              }
            };

            const hasRules = async (name) => {
              try {
                const { data } = await github.rest.repos.getBranchRules({ owner, repo, branch: name });
                return Array.isArray(data) && data.length > 0;
              } catch (error) {
                console.log(`Cannot read rulesets for ${name} (${error.status}); skipping.`);
                return true;
              }
            };

            // "Merged" must be positively established. Reachable from the
            // default branch covers merge commits and fast-forwards; for squash
            // and rebase the branch tip is never an ancestor, so fall back to a
            // merged pull request whose recorded head SHA still equals the
            // current tip. Anything else is ambiguous and is skipped.
            const isMerged = async (name, tip) => {
              try {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: `${defaultBranch}...${tip}`,
                });
                if (data.status === 'behind' || data.status === 'identical') return 'reachable';
              } catch (error) {
                console.log(`Cannot compare ${name} (${error.status}); skipping.`);
                return null;
              }
              const merged = mergedHeadShas.get(name);
              if (merged && merged.sha === tip) return 'squash-or-rebase';
              return null;
            };

            let deleted = 0;
            let skipped = 0;
            for (const branch of branches) {
              const name = branch.name;
              const tip = branch.commit.sha;
              if (keep.has(name)) { skipped++; continue; }

              let committedAt;
              try {
                const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: tip });
                committedAt = new Date(commit.commit.committer.date);
              } catch (error) {
                console.log(`Cannot read tip of ${name} (${error.status}); skipping.`);
                skipped++;
                continue;
              }
              if (committedAt >= cutoff) { skipped++; continue; }

              if (await isProtected(name) || await hasRules(name)) { skipped++; continue; }

              const evidence = await isMerged(name, tip);
              if (!evidence) {
                console.log(`No positive merge evidence for ${name} at ${tip}; skipping.`);
                skipped++;
                continue;
              }

              if (dryRun) {
                console.log(`[dry run] would delete ${name} (${evidence}, tip ${tip})`);
                skipped++;
                continue;
              }
              console.log(`Deleting ${name} (${evidence}, tip ${tip})`);
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
              deleted++;
            }

            await core.summary
              .addHeading('Stale branch cleanup', 3)
              .addRaw(dryRun ? 'Dry run — nothing was deleted.\n\n' : '')
              .addRaw(`Deleted: ${deleted} · Skipped: ${skipped} · Default branch: ${defaultBranch}\n`)
              .write();

  branch-naming-validation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: "Report branch naming convention"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const validPatterns = [
              /^dependabot\/.+$/,
              /^feat\/.+$/,
              /^fix\/.+$/,
              /^docs\/.+$/,
              /^refactor\/.+$/,
              /^test\/.+$/,
              /^perf\/.+$/,
              /^chore\/.+$/,
              /^ci\/.+$/,
              /^build\/.+$/,
              /^codex\/.+$/,
              /^main$/,
            ];

            if (validPatterns.some((pattern) => pattern.test(branchName))) {
              core.info(`Branch name follows the convention: ${branchName}`);
              return;
            }

            // A branch name is a suggestion, not a merge requirement. Renaming
            // a branch mid-review forces a new pull request, which costs more
            // than the inconsistency it would fix.
            core.notice(
              `Branch "${branchName}" does not match the suggested convention ` +
                `(feat/, fix/, docs/, chore/, ci/, build/, codex/, dependabot/). ` +
                `This does not block the pull request; please use one of these prefixes next time.`,
            );
            await core.summary
              .addHeading('Branch naming', 3)
              .addRaw(`\`${branchName}\` does not match the suggested prefixes. `)
              .addRaw('This is advisory and does not block this pull request.\n')
              .write();
